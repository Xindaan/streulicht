<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sonnenuntergang bewerten</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column;
         align-items:center; justify-content:center; gap:1.5rem;
         background:#0d1117; color:#e6edf2;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  h1 { font-size:1.25rem; font-weight:500; margin:0; text-align:center; }
  .datum { color:#8b949e; font-size:.9rem; }
  .knoepfe { display:flex; gap:.75rem; flex-wrap:wrap; justify-content:center;
             padding:0 1rem; }
  button { width:4rem; height:4rem; border-radius:50%; border:1px solid #30363d;
           background:#161b22; color:#e6edf2; font-size:1.5rem; font-weight:500;
           cursor:pointer; transition:transform .1s, background .15s; }
  button:hover { background:#21262d; }
  button:active { transform:scale(.92); }
  .legende { color:#8b949e; font-size:.8rem; display:flex; gap:2.5rem; }
  #status { min-height:1.5rem; color:#f0883e; font-size:.95rem; text-align:center;
            padding:0 1rem; }
  .hinweis { color:#484f58; font-size:.75rem; max-width:22rem; text-align:center;
             padding:0 1rem; line-height:1.5; }
</style>
</head>
<body>
  <h1>Wie war der Sonnenuntergang?</h1>
  <div class="datum" id="datum"></div>
  <div class="knoepfe" id="knoepfe"></div>
  <div class="legende"><span>1 = nichts</span><span>5 = spektakulär</span></div>
  <div id="status"></div>
  <p class="hinweis">
    Diese Seite zeigt bewusst keine Prognose. Erst bewerten, dann nachsehen —
    sonst misst die Bewertung die Vorhersage statt den Himmel.
  </p>

<script>
// Topic wird beim Erzeugen der Seite ersetzt; Platzhalter fuer den Fall,
// dass jemand die Datei direkt oeffnet.
const TOPIC = "__NTFY_BEWERTUNG__";
const ORT   = "__ORT__";

const heute = new Date();
// Vor 04:00 Ortszeit zaehlt der Abend als "gestern" - wer um 1 Uhr bewertet,
// meint den Sonnenuntergang von gestern.
if (heute.getHours() < 4) heute.setDate(heute.getDate() - 1);
const tag = heute.getFullYear() + "-" +
            String(heute.getMonth() + 1).padStart(2, "0") + "-" +
            String(heute.getDate()).padStart(2, "0");
document.getElementById("datum").textContent =
  heute.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});

const knoepfe = document.getElementById("knoepfe");
const status  = document.getElementById("status");

for (let n = 1; n <= 5; n++) {
  const b = document.createElement("button");
  b.textContent = n;
  b.onclick = () => senden(n, b);
  knoepfe.appendChild(b);
}

const b0 = document.createElement("button");
b0.textContent = "–";
b0.title = "nicht gesehen";
b0.style.fontSize = "1.1rem";
b0.onclick = () => senden(0, b0);
knoepfe.appendChild(b0);

async function senden(note, knopf) {
  status.textContent = "sende …";
  const nutzlast = JSON.stringify({ort: ORT, tag: tag, note: note});
  try {
    const r = await fetch("https://ntfy.sh/" + TOPIC, {
      method: "POST",
      body: nutzlast,
      headers: {"Title": "Bewertung " + tag, "Tags": "star"}
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    status.textContent = note === 0
      ? "Notiert: nicht gesehen."
      : "Danke — " + note + " für den " + tag + ".";
    knoepfe.querySelectorAll("button").forEach(x => x.disabled = true);
    knopf.style.background = "#f0883e";
    knopf.style.color = "#0d1117";
  } catch (e) {
    status.textContent = "Fehlgeschlagen (" + e.message + "). Nochmal versuchen?";
  }
}
</script>
</body>
</html>
